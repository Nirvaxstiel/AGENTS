mcp_servers:
  codebase-memory-mcp:
    command: ~/Appdata/Roaming/uv/python/cpython-3.11-windows-x86_64-none/python.exe
    args:
      - ~/.local/bin/codebase-memory-mcp-shim.py
      - ~/.local/bin/codebase-memory-mcp.exe
      
  jcodemunch:
    command: uvx
    args:
      - jcodemunch-mcp
  nu-mcp:
    command: nu
    args:
      - --mcp
web:
  backend: "exa"
skills:
  external_dirs:
    - ~/.agents/skills
    - ~/.claude/skills
